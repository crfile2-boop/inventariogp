<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario Dynamics GP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    h1 { color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <h1>Inventario de Productos</h1>
  <p id="hora"></p>

  <table id="tabla-inventario">
    <thead><tr id="cabecera"></tr></thead>
    <tbody id="cuerpo"></tbody>
  </table>

  <script>
    async function cargarDatos() {
      try {
        const respuesta = await fetch('inventario.json?t=' + new Date().getTime());
        const datos = await respuesta.json();
        if (datos.length === 0) return;

        const cabecera = document.getElementById('cabecera');
        cabecera.innerHTML = '';
        Object.keys(datos[0]).forEach(col => {
          const th = document.createElement('th');
          th.textContent = col;
          cabecera.appendChild(th);
        });

        const cuerpo = document.getElementById('cuerpo');
        cuerpo.innerHTML = '';
        datos.forEach(fila => {
          const tr = document.createElement('tr');
          Object.values(fila).forEach(val => {
            const td = document.createElement('td');
            td.textContent = val;
            tr.appendChild(td);
          });
          cuerpo.appendChild(tr);
        });

        document.getElementById('hora').innerText = 'Última actualización: ' + new Date().toLocaleTimeString();
      } catch (e) {
        console.error('Error cargando datos:', e);
      }
    }

    cargarDatos();
    setInterval(cargarDatos, 900000); // Se recarga en pantalla cada 15 min
  </script>

</body>
</html>
